version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, security]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase
    groups:
      npm-dependencies:
        patterns: ["*"]
    labels: [dependencies, security]

  - package-ecosystem: pip
    directory: /packages/python
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]
    labels: [dependencies, security]
